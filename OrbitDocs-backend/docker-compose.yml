services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: orbitdocs_postgres
    environment:
      - POSTGRES_DB=orbitdocs_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=12345
    ports:
      - "5432:5432"
    volumes:
      - orbitdocs-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  orbitdocs-data: