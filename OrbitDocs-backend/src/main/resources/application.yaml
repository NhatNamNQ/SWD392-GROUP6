spring:
  application:
    name: OrbitDocs-backend

  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orbitdocs_db}
    username: ${DB_USERNAME:orbitdocs_admin}
    password: ${DB_PASSWORD:orbitdocs_password}

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # data.sql chạy SAU khi Hibernate tạo xong schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Seed data ─────────────────────────────────────────────
  sql:
    init:
      mode: always # Luôn chạy data.sql (INSERT idempotent, an toàn)

# ── JWT ─────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:orbitdocs-default-secret-key-change-in-production-min-32-chars}
  access-token-expiry-seconds: 900 # 15 phút
  refresh-token-expiry-seconds: 604800 # 7 ngày

# ── Storage ───────────────────────────────────────────────────
app:
  storage:
    upload-dir: ${UPLOAD_DIR:uploads/documents}

# ── Python RAG service (internal) ───────────────────────────
rag:
  internal-url: ${PYTHON_RAG_URL:http://localhost:8000}

# ── Swagger / SpringDoc ─────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    swd392.project: DEBUG
    org.hibernate.SQL: DEBUG
