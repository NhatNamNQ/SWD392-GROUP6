spring:
  application:
    name: OrbitDocs-backend

  config:
    import: optional:file:.env[.properties], optional:file:../.env[.properties]

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true # data.sql chạy SAU khi Hibernate tạo xong schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # ── SMTP ───────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${SMTP_FROM_EMAIL}
  # ── Seed data ─────────────────────────────────────────────
  sql:
    init:
      mode: always # Luôn chạy data.sql (INSERT idempotent, an toàn)

# ── JWT ─────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: 900 # 15 phút
  refresh-token-expiry-seconds: 604800 # 7 ngày


# ── Storage ───────────────────────────────────────────────────
app:
  storage:
    upload-dir: ${UPLOAD_DIR}

# ── Python RAG service (internal) ───────────────────────────
rag:
  internal-url: ${PYTHON_RAG_URL}
  internal-api-key: ${INTERNAL_API_KEY}

# ── Swagger / SpringDoc ─────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always

# ── Logging ─────────────────────────────────────────────────
logging:
  level:
    swd392.project: DEBUG
    org.hibernate.SQL: DEBUG
