<!doctype html>
<html lang="en"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OrbitDocs - Login</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap");

      :root {
        --bg: #f4f4f5;
        --surface: #ffffff;
        --ink: #1f2937;
        --muted: #64748b;
        --line: #cbd5e1;
        --line-strong: #334155;

        --blue: #dbeafe;
        --mint: #d1fae5;
        --peach: #ffedd5;
        --pink: #fce7f3;
        --yellow: #fef3c7;

        --chip-shadow: 3px 3px 0 rgba(30, 41, 59, 0.14);
        --card-shadow: 4px 4px 0 rgba(30, 41, 59, 0.14);

        --radius-lg: 12px;
        --radius-md: 8px;
        --radius-sm: 6px;

        --font: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font);
        color: var(--ink);
        background: #f8fafc;
        line-height: 1.45;
        display: flex;
        flex-direction: column;
      }
      a { color: inherit; text-decoration: none; }

      .container {
        width: min(1120px, 100% - 32px);
        margin: 0 auto;
      }

      .frame {
        border: 1.5px solid var(--line-strong);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--card-shadow);
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(248, 250, 252, 0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid #e2e8f0;
      }

      .nav-wrap {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        padding: 12px 0;
      }
      
      .nav-wrap nav,
      .nav-wrap .nav-actions {
        display: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        border: 1.5px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--mint);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #166534;
      }
      .brand strong { font-size: 18px; }
      .brand small {
        display: block;
        color: var(--muted);
        font-weight: 700;
      }

      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      nav a {
        border: 1.5px solid var(--line);
        border-radius: 999px;
        background: #fff;
        padding: 7px 12px;
        font-size: 13px;
        font-weight: 800;
        box-shadow: var(--chip-shadow);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .cta {
        border: 1.5px solid var(--line-strong);
        border-radius: var(--radius-sm);
        background: var(--blue);
        padding: 8px 12px;
        font-weight: 800;
        box-shadow: var(--chip-shadow);
      }
      .cta.ghost { background: #fff; }
      .cta.peach { background: var(--peach); }

      main { 
        flex: 1;
        padding: 18px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .section-head {
        padding: 8px 12px;
        border-bottom: 1.5px solid var(--line-strong);
        font-size: 13px;
        font-weight: 800;
      }

      .auth-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        padding: 14px;
        min-height: 400px;
        align-items: stretch;
      }

      .auth-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .auth-copy h1 {
        margin: 0 0 8px;
        font-size: clamp(26px, 3.4vw, 38px);
        line-height: 1.1;
      }
      .auth-copy p {
        margin: 0 0 12px;
        color: #475569;
        flex: 1;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tag {
        border: 1.5px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        background: #fff;
        font-size: 12px;
        font-weight: 800;
      }
      .tag.blue { background: var(--blue); }
      .tag.mint { background: var(--mint); }
      .tag.peach { background: var(--peach); }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: center;
      }
      label {
        font-size: 12px;
        font-weight: 800;
        color: #475569;
      }
      input {
        width: 100%;
        border: 1.5px solid var(--line-strong);
        border-radius: var(--radius-sm);
        padding: 9px 12px;
        font-family: var(--font);
        font-size: 14px;
        background: #fff;
        box-shadow: var(--chip-shadow);
      }
      .helper {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .helper a { font-weight: 800; }

      .site-footer {
        border-top: 1px solid #e2e8f0;
        padding: 14px 0 20px;
        color: var(--muted);
        font-size: 12px;
        margin-top: auto;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      @media (max-width: 980px) {
        .auth-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 760px) {
        .nav-wrap { align-items: flex-start; flex-direction: column; }
        nav { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="site-header" style="border-bottom: none; background: transparent;">
      <div class="container nav-wrap" style="justify-content: flex-start; padding: 12px 0;">
        <div class="brand">
          <div class="brand-mark">OD</div>
          <div>
            <strong>OrbitDocs</strong>
            <small>Student-Friendly RAG Workspace</small>
          </div>
        </div>
        <button style="margin-left: auto; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--ink);">✕</button>
      </div>
    </header>

    <main style="display: flex; align-items: stretch; flex: 1;">
      <div style="flex: 1 1 0%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; background: #ffffff;">
        <h2 style="margin: 0 0 16px; font-size: 28px; font-weight: 800; color: #1f2937; text-align: center;">Welcome to OrbitDocs</h2>
        <p style="margin: 0 0 20px; color: #64748b; text-align: center; font-size: 15px; line-height: 1.6; max-width: 280px;">
          Your friendly learning workspace with document-based chatbot. Ask questions, get cited answers.
        </p>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;">
          <span style="border: 1.5px solid #cbd5e1; border-radius: 999px; padding: 6px 10px; background: #dbeafe; font-size: 12px; font-weight: 800;">AI Chat</span>
          <span style="border: 1.5px solid #cbd5e1; border-radius: 999px; padding: 6px 10px; background: #d1fae5; font-size: 12px; font-weight: 800;">Citations</span>
          <span style="border: 1.5px solid #cbd5e1; border-radius: 999px; padding: 6px 10px; background: #ffedd5; font-size: 12px; font-weight: 800;">SWD392</span>
        </div>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 40px; background: #fff;">
        <h1 style="margin: 0 0 8px; font-size: 32px; font-weight: 800;">Login</h1>

        <form style="display: flex; flex-direction: column; gap: 14px;">
          <div>
            <label style="display: block; font-size: 12px; font-weight: 800; margin-bottom: 6px; color: #475569;">Email</label>
            <input type="email" placeholder="you@school.edu" style="width: 100%; border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 10px 12px; font-family: var(--font); font-size: 14px; background: #fff;">
          </div>
          <div>
            <label style="display: block; font-size: 12px; font-weight: 800; margin-bottom: 6px; color: #475569;">Password</label>
            <input type="password" placeholder="••••••••" style="width: 100%; border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 10px 12px; font-family: var(--font); font-size: 14px; background: #fff;">
          </div>
          <button type="button" style="border: 1.5px solid var(--line-strong); border-radius: 6px; padding: 12px; background: rgb(236, 253, 245); font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: var(--chip-shadow);">
            Login →
          </button>
        </form>

        <div style="margin-top: 14px; text-align: center;">
          <a href="#" style="color: #3b82f6; font-weight: 800; font-size: 14px;">Forgot password?</a>
        </div>

        <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--muted);">
          New to OrbitDocs? <a href="register.html" style="color: #3b82f6; font-weight: 800;">Create an account</a>
        </div>
      </div>
    </main>
  

</body></html>
