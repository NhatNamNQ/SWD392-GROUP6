# Local-development skeleton for the documented architecture.
#
# This file is intentionally minimal and will only run after the service
# Dockerfiles and the Java backend submodule are added.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swd392-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swd_user
      POSTGRES_PASSWORD: swd_password
      POSTGRES_DB: swd_chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-network

  nextjs-frontend:
    build:
      context: ./services/nextjs-frontend
    container_name: swd392-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_NAME: SWD392 Course Document Chatbot
      JAVA_BACKEND_URL: http://java-backend:8081
      PYTHON_RAG_URL: http://python-backend:8000
    depends_on:
      - java-backend
      - python-backend
    networks:
      - chatbot-network

  java-backend:
    build:
      context: ./services/java-backend
    container_name: swd392-java-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swd_chatbot_db
      SPRING_DATASOURCE_USERNAME: swd_user
      SPRING_DATASOURCE_PASSWORD: swd_password
      PYTHON_RAG_URL: http://python-backend:8000
    depends_on:
      - postgres
    networks:
      - chatbot-network

  python-backend:
    build:
      context: ./services/python-backend
    container_name: swd392-python-backend
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://swd_user:swd_password@postgres:5432/swd_chatbot_db
      VECTOR_STORE: pgvector
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - postgres
    networks:
      - chatbot-network

volumes:
  postgres_data:

networks:
  chatbot-network:
    driver: bridge
